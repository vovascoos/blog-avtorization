{% extends 'base.html' %}
{% block content %}
<h1>Все посты</h1>
{% for post in posts %}
    <div class="post">
        <h2>{{ post.title }}</h2>
        <p>{{ post.content }}</p>
        <small>Автор: {{ post.author.username }} | {{ post.date.strftime('%d.%m.%Y') }}</small>
    </div>
{% endfor %}
{% endblock %}
